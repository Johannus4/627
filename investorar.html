<!DOCTYPE html>
<html lang="fo">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>62-7 — Íleggingarpallur</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#12181E; --panel:#1A222B; --panel2:#212B35;
  --line:rgba(158,178,184,.18);
  --ink:#E8EDEA; --soft:#93A3A9;
  --sea:#4E9C8F; --gold:#C2A24C; --red:#C9655A; --green:#5FA882;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,sans-serif;font-size:15px;line-height:1.5}
h1,h2,h3,.disp{font-family:"Barlow Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;line-height:1}
.mono{font-family:"IBM Plex Mono",monospace}
.soft{color:var(--soft)}
.wrap{max-width:1180px;margin:0 auto;padding:0 22px}

/* login */
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}
.card{background:var(--panel);border:1px solid var(--line);padding:34px;width:100%;max-width:400px}
.brand{font-family:"Barlow Condensed",sans-serif;font-size:46px;font-weight:600;letter-spacing:.03em;line-height:1}
.brand small{display:block;font-size:11px;letter-spacing:.24em;color:var(--sea);font-family:"IBM Plex Mono",monospace;margin-top:7px;text-transform:uppercase}
label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft);margin:16px 0 6px;font-family:"IBM Plex Mono",monospace}
input,select,textarea{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--ink);
  padding:10px 12px;font-family:inherit;font-size:15px;border-radius:0;
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sea);outline-offset:-1px}
button{
  background:var(--sea);color:#0E1418;border:none;padding:11px 18px;font-weight:600;
  cursor:pointer;font-family:"Barlow Condensed",sans-serif;font-size:16px;
  text-transform:uppercase;letter-spacing:.06em;
}
button:hover{filter:brightness(1.12)}
button.ghost{background:none;color:var(--sea);border:1px solid var(--line);padding:7px 13px;font-size:14px}
button.danger{background:none;color:var(--red);border:1px solid var(--line);padding:6px 11px;font-size:13px}
.err{background:rgba(201,101,90,.14);border:1px solid var(--red);color:#F0C0BA;padding:10px 12px;margin-top:14px;font-size:14px}
.ok{background:rgba(95,168,130,.13);border:1px solid var(--green);color:#BBE3CC;padding:10px 12px;margin-top:14px;font-size:14px}

/* app chrome */
header{border-bottom:1px solid var(--line);background:var(--panel)}
.hrow{display:flex;align-items:center;justify-content:space-between;padding:16px 0;gap:14px;flex-wrap:wrap}
.who{font-size:13px;color:var(--soft);text-align:right}
.badge{display:inline-block;background:var(--panel2);border:1px solid var(--line);color:var(--sea);
  font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;padding:3px 8px;text-transform:uppercase}
nav{display:flex;gap:2px;border-bottom:1px solid var(--line);background:var(--panel);overflow-x:auto}
nav button{background:none;color:var(--soft);border:none;border-bottom:2px solid transparent;
  padding:13px 18px;font-size:15px;white-space:nowrap}
nav button.on{color:var(--ink);border-bottom-color:var(--sea)}
main{padding:30px 0 80px}

/* tables & panels */
.panel{background:var(--panel);border:1px solid var(--line);padding:22px;margin-bottom:22px}
.phead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px;flex-wrap:wrap}
h2{font-size:24px;font-weight:600}
h3{font-size:19px;font-weight:600;margin-bottom:4px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;
  text-transform:uppercase;color:var(--soft);padding:9px 10px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
td.num,th.num{text-align:right;font-family:"IBM Plex Mono",monospace}
tr:hover td{background:rgba(255,255,255,.02)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.stat{background:var(--panel2);border:1px solid var(--line);padding:16px}
.stat .l{font-family:"IBM Plex Mono",monospace;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.stat .v{font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:600;margin-top:5px}
.green{color:var(--green)} .red{color:var(--red)} .gold{color:var(--gold)} .sea{color:var(--sea)}
.empty{color:var(--soft);font-style:italic;padding:14px 0}
dialog{background:var(--panel);border:1px solid var(--line);color:var(--ink);padding:26px;max-width:540px;width:94%}
dialog::backdrop{background:rgba(0,0,0,.65)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spin{padding:50px;text-align:center;color:var(--soft)}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}
  table{font-size:13px} th,td{padding:8px 6px}}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login">
  <div class="card">
    <div class="brand">62-7<small>Íleggingarpallur</small></div>
    <form id="loginForm">
      <label>Teldupostur</label>
      <input type="email" id="email" required autocomplete="email">
      <label>Loyniorð</label>
      <input type="password" id="pw" required autocomplete="current-password" minlength="6">
      <div style="margin-top:22px" class="row">
        <button type="submit" id="btnIn">Rita inn</button>
        <button type="button" class="ghost" id="btnUp">Stovna brúkara</button>
      </div>
    </form>
    <div id="loginMsg"></div>
    <div id="build" style="margin-top:18px;font-family:'IBM Plex Mono',monospace;
         font-size:11px;color:var(--red);letter-spacing:.1em">
      útgáva v5 — JS er IKKI koyrdur</div>
  </div>
</div>

<!-- ================= APP ================= -->
<div id="app" style="display:none">
  <header>
    <div class="wrap hrow">
      <div class="brand" style="font-size:30px">62-7<small>Íleggingarpallur</small></div>
      <div class="who">
        <div id="uName"></div>
        <div style="margin-top:5px"><span class="badge" id="uRole"></span>
          <button class="ghost" id="btnOut" style="margin-left:7px">Út</button></div>
      </div>
    </div>
  </header>
  <nav class="wrap" id="tabs"></nav>
  <main class="wrap" id="view"><div class="spin">Heintar…</div></main>
</div>

<dialog id="dlg"><div id="dlgBody"></div></dialog>

<script>
/* Fyrsta tekin: vísir at JS í roynd og veru koyrir. */
(function(){
  var b=document.getElementById('build');
  if(b){ b.textContent='útgáva v5 — JS koyrir'; b.style.color='var(--green)'; }
})();

/* Vís allar villur beint á síðuni — so tykist ikki "einki hendir". */
function fatal(t){
  const box = document.getElementById('loginMsg') || document.body;
  box.innerHTML = '<div class="err" style="white-space:pre-wrap">' + String(t) + '</div>';
}
window.addEventListener('error', e => fatal('Villa: ' + (e.message||e)));
window.addEventListener('unhandledrejection', e => fatal('Villa: ' + (e.reason && e.reason.message || e.reason)));
if (typeof supabase === 'undefined' || !supabase.createClient) {
  fatal('Supabase-bókasavnið varð ikki lisið.\n\n'
      + 'Tað merkir vanliga at teldan ikki hevur samband við netið, '
      + 'ella at ein annonsublokkari steðgar cdn.jsdelivr.net.\n\n'
      + 'Royn: kanna netsambandið, ella sláa annonsublokkaran frá fyri hesa síðu.');
  throw new Error('supabase-js vantar');
}

const SB_URL = 'https://wmhelepdlzajgiiaazir.supabase.co';
const SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndtaGVsZXBkbHphamdpaWFhemlyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg0MzYzOTEsImV4cCI6MjA5NDAxMjM5MX0.QZk9I5IjeA_FtQUo86oaf3GudXDiDmUkB0nXqgC3cY4';
const sb = supabase.createClient(SB_URL, SB_KEY);

const $ = id => document.getElementById(id);
const kr = n => (Math.round(n||0)).toLocaleString('da-DK') + ' kr';
const krS = n => { n = n||0; const a=Math.abs(n);
  if(a>=1e6) return (n/1e6).toFixed(2)+' mio';
  if(a>=1e3) return Math.round(n/1e3)+'k'; return Math.round(n)+''; };
const esc = s => String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let ME=null, ROLE='investor', TAB='yvirlit';
let DATA={props:[],owners:[],dists:[],docs:[],companies:[],profiles:[],ploans:[],units:[],cowners:[],partyloans:[],people:[],rates:[]};
let OPEN=null, OPENC=null;  // ogn / felag sum er opið

/* ---------- auth ---------- */
$('loginForm').onsubmit = async e => {
  e.preventDefault(); msg('Ritar inn…','ok');
  try{
    const {data,error} = await sb.auth.signInWithPassword(
      {email:$('email').value.trim(), password:$('pw').value});
    if(error) return msg(error.message,'err');
    if(!data || !data.session) return msg('Eingin session kom aftur.','err');
    msg('');
  }catch(err){ msg('Netsvilla: '+(err && err.message || err),'err'); }
};
// Belti og bøkslur: knappurin virkar eisini um "submit" ikki fer í gongd
$('btnIn').onclick = e => { e.preventDefault(); $('loginForm').onsubmit(e); };
$('btnUp').onclick = async () => {
  msg('');
  const {error} = await sb.auth.signUp({email:$('email').value, password:$('pw').value});
  if(error) return msg(error.message,'err');
  msg('Brúkarin er stovnaður. Kannaðu teldupostin um tað verður biðið um váttan — annars kanst tú rita inn beinanvegin.','ok');
};
$('btnOut').onclick = () => sb.auth.signOut();
function msg(t,cls){ $('loginMsg').innerHTML = t ? `<div class="${cls}">${esc(t)}</div>` : ''; }

sb.auth.onAuthStateChange((_e,session)=>{ session ? boot(session) : showLogin(); });
sb.auth.getSession().then(({data})=>{ data.session ? boot(data.session) : showLogin(); });

function showLogin(){ $('login').style.display='flex'; $('app').style.display='none'; ME=null; }

async function boot(session){
  $('login').style.display='none'; $('app').style.display='block';
  const {data:prof} = await sb.from('profiles').select('*').eq('id',session.user.id).maybeSingle();
  ME = prof || {id:session.user.id, email:session.user.email, full_name:session.user.email, role:'investor'};
  ROLE = ME.role || 'investor';
  $('uName').textContent = ME.full_name || ME.email;
  $('uRole').textContent = ROLE==='admin' ? 'Umsitari' : 'Íleggjari';
  renderTabs(); await load(); render();
}

function renderTabs(){
  const t = ROLE==='admin'
    ? [['yvirlit','Yvirlit'],['ognir','Ognir'],['felog','Feløg'],['eigarar','Eigarar'],['marknadur','Marknaður'],['deal','Deal-greining'],['utgjald','Útgjaldingar'],['skjol','Skjøl'],['brukarar','Brúkarar']]
    : [['yvirlit','Yvirlit'],['minognir','Mínar ognir'],['utgjald','Mínar útgjaldingar'],['skjol','Skjøl']];
  if(!t.find(x=>x[0]===TAB)) TAB=t[0][0];
  $('tabs').innerHTML = t.map(([k,l])=>`<button data-t="${k}" class="${k===TAB?'on':''}">${l}</button>`).join('');
  $('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{TAB=b.dataset.t;renderTabs();render();});
}

/* ---------- data ---------- */
async function load(){
  const q = async (t,sel='*') => (await sb.from(t).select(sel)).data || [];
  DATA.props     = await q('properties');
  DATA.owners    = await q('property_owners');
  DATA.dists     = await q('distributions');
  DATA.docs      = await q('documents');
  DATA.companies = await q('companies');
  DATA.ploans    = await q('property_loans');
  DATA.units     = await q('property_units');
  DATA.cowners   = await q('company_owners');
  DATA.partyloans= await q('party_loans');
  DATA.people    = await q('company_people');
  DATA.rates     = await q('loan_rates');
  DATA.profiles  = ROLE==='admin' ? await q('profiles') : [ME];
}

const pName = id => (DATA.props.find(p=>p.id===id)||{}).name || '—';
const uName = id => { const u=DATA.profiles.find(x=>x.id===id); return u ? (u.full_name||u.email) : '—'; };
const coName = id => (DATA.companies.find(c=>c.id===id)||{}).name || '—';

/* Frívirði = virði − lán. Hvør eigari fær fyrst sína eginfígging
   aftur; bert tað sum er umframt verður býtt eftir partinum. */
function calc(p, own){
  const equity = (p.current_value||0) - (p.loan_balance||0);
  const totalCap = p.total_capital || 0;
  const surplus = equity - totalCap;
  if(!own) return {equity, totalCap, surplus};
  const pct = (own.pct||0)/100;
  const gain = surplus * pct;
  return {equity, totalCap, surplus, pct, capital:own.capital||0, gain, share:(own.capital||0)+gain};
}

/* ---------- render ---------- */
function render(){
  const v = $('view');
  if(TAB==='yvirlit'){
    v.innerHTML = ROLE==='admin' ? adminOverview() : investorOverview();
    if(ROLE==='admin' && !MKT.loaded) initMarket().then(()=>{ if(TAB==='yvirlit') render(); });
  }
  else if(TAB==='ognir')    v.innerHTML = OPEN ? propDetail() : propsTab();
  else if(TAB==='felog')    v.innerHTML = OPENC ? compDetail() : compsTab();
  else if(TAB==='eigarar')  v.innerHTML = ownersTab();
  else if(TAB==='minognir') v.innerHTML = myProps();
  else if(TAB==='utgjald')  v.innerHTML = distTab();
  else if(TAB==='skjol')    v.innerHTML = docsTab();
  else if(TAB==='brukarar') v.innerHTML = usersTab();
  else if(TAB==='marknadur'){ v.innerHTML = marketTab(); setTimeout(initMarket,0); }
  else if(TAB==='deal'){ v.innerHTML = dealTab(); setTimeout(initDeal,0); }
  wire();
}

// ============================================================
// VIRÐISMETING — eru okkara ognir stignar ella falnar?
// Samanberur móti marknaðinum í somu bygd (kr/m²).
// ============================================================
// Virðismetingin skal ALDRI blanda marknaðirnar: ein donsk býlingur
// kann annars matcha eina føroyska adressu og geva eitt skeivt virði.
const VAL_MARKET = 'fo';
const valRows = () => MKT.rows.filter(r=>r.market===VAL_MARKET);

function placeOf(p){
  const addr=(p.address||'')+' '+(p.name||'');
  const places=[...new Set(valRows().map(r=>r.place))].filter(x=>x&&x!=='—');
  const hit=places.find(pl=>addr.toLowerCase().includes(String(pl).toLowerCase()));
  return hit || null;
}

function valuation(){
  if(!valRows().length) return null;
  return DATA.props.map(p=>{
    const place=placeOf(p);
    const cp=place? valRows().filter(r=>r.place===place && r.ppm2)
                  : valRows().filter(r=>r.ppm2);
    const ppm=median(cp.map(r=>r.ppm2));
    const est = (p.area && ppm) ? p.area*ppm : null;
    const book = p.current_value||0;
    const diff = est!=null ? est-book : null;
    // Hví: hvussu nógv flyta prísirnir seg í bygdini?
    const moves=cp.filter(r=>r.price_change_pct!=null).map(r=>r.price_change_pct);
    const avgMove = moves.length? moves.reduce((a,b)=>a+b,0)/moves.length : null;
    const avgDays = median(cp.map(r=>r.days));
    return {p, place, n:cp.length, ppm, est, book, diff,
            pct: (est!=null&&book)? diff/book*100 : null, avgMove, avgDays};
  });
}

function valuationPanel(){
  const v=valuation();
  if(!v) return `<div class="panel"><h3>Virðismeting</h3>
    <div class="empty">Ongar marknaðardátur enn — set scraparan upp.</div></div>`;
  const withArea=v.filter(x=>x.est!=null);
  const tot = withArea.reduce((s,x)=>s+x.diff,0);
  const miss = v.filter(x=>!x.p.area).length;
  return `<div class="panel">
    <div class="phead"><h3>Virðismeting móti føroyska marknaðinum</h3>
      ${withArea.length?`<span class="badge" style="color:var(--${tot>=0?'green':'red'})">
        ${tot>=0?'+':''}${krS(tot)} tilsamans</span>`:''}</div>
    ${miss?`<div class="soft" style="margin-bottom:14px;font-size:14px">
      ${miss} ogn${miss>1?'ir':''} vanta stødd (m²) — rætta ognina og skriva støddina inn,
      so kemur hon við í metingini.</div>`:''}
    ${withArea.length? table(
      ['Ogn','Bygd','Samanb.','Marknaður kr/m²','Bókað virði','Mett virði','Munur','Hví'],
      withArea.map(x=>[
        esc(x.p.name), esc(x.place||'—'), {n:x.n},
        {n:Math.round(x.ppm).toLocaleString('da-DK')},
        {n:krS(x.book)}, {n:krS(x.est),c:'gold'},
        {n:(x.diff>=0?'+':'')+krS(x.diff)+' ('+(x.pct>=0?'+':'')+x.pct.toFixed(1)+'%)',
         c:x.diff>=0?'green':'red'},
        esc(x.avgMove!=null&&Math.abs(x.avgMove)>0.5
            ? `prísir ${x.avgMove>0?'upp':'niður'} ${Math.abs(x.avgMove).toFixed(1)}% í bygdini`
            : x.avgDays!=null ? `miðal liggitíð ${Math.round(x.avgDays)} dagar`
            : `${x.n} samanberiligar`)
      ]))
      : '<div class="empty">Ongar ognir við stødd skrásettari.</div>'}
    <div class="soft" style="margin-top:12px;font-size:14px">
      Metingin er marknaðarins miðal kr/m² í bygdini gangað við støddini. Hon tekur ikki
      hædd fyri standi, útsýni ella umvæling — brúka hana sum eina vísing, ikki eina vurdering.</div>
  </div>`;
}

function adminOverview(){
  let val=0, loan=0, cf=0;
  DATA.props.forEach(p=>{ val+=p.current_value||0; loan+=p.loan_balance||0; cf+=p.monthly_cashflow||0; });
  return `<div class="grid3">
    <div class="stat"><div class="l">Samlað virði</div><div class="v gold">${krS(val)}</div></div>
    <div class="stat"><div class="l">Frívirði</div><div class="v sea">${krS(val-loan)}</div></div>
    <div class="stat"><div class="l">CF á mána</div><div class="v ${cf>=0?'green':'red'}">${krS(cf)}</div></div>
  </div>
  ${valuationPanel()}
  <div class="panel" style="margin-top:22px"><h2>Ognir</h2>
  ${DATA.props.length? table(
    ['Ogn','Felag','Virði','Lán','Frívirði','Eigarar'],
    DATA.props.map(p=>{
      const n = DATA.owners.filter(o=>o.property_id===p.id).length;
      return [esc(p.name), esc(coName(p.company_id)),
        {n:krS(p.current_value)}, {n:krS(p.loan_balance)},
        {n:krS((p.current_value||0)-(p.loan_balance||0)), c:'sea'}, {n:n}];
    })) : `<div class="empty">Ongar ognir enn. Far á "Ognir" og legg eina til.</div>`}</div>`;
}

function investorOverview(){
  const mine = DATA.owners.filter(o=>o.user_id===ME.id);
  let cap=0, share=0, gain=0;
  mine.forEach(o=>{ const p=DATA.props.find(x=>x.id===o.property_id); if(!p) return;
    const c=calc(p,o); cap+=c.capital; share+=c.share; gain+=c.gain; });
  const paid = DATA.dists.filter(d=>d.user_id===ME.id).reduce((s,d)=>s+(d.amount||0),0);
  return `<div class="grid3">
    <div class="stat"><div class="l">Mín eginfígging</div><div class="v">${krS(cap)}</div></div>
    <div class="stat"><div class="l">Mítt frívirði</div><div class="v gold">${krS(share)}</div></div>
    <div class="stat"><div class="l">Reel vinningur</div><div class="v ${gain>=0?'green':'red'}">${krS(gain)}</div></div>
  </div>
  <div class="panel" style="margin-top:22px">
    <h3>Útgoldið til tín</h3>
    <div class="mono green" style="font-size:26px;margin-top:6px">${kr(paid)}</div>
    <p class="soft" style="margin-top:10px;font-size:14px">
      Tú sært bert tínar egnu tølir. Hvat aðrir eigarar hava lagt inn, er ikki atkomuligt.</p>
  </div>
  ${mine.length? '' : '<div class="panel"><div class="empty">Tú ert enn ikki skrásettur sum eigari av nakrari ogn.</div></div>'}`;
}

function myProps(){
  const mine = DATA.owners.filter(o=>o.user_id===ME.id);
  if(!mine.length) return `<div class="panel"><div class="empty">Ongar ognir.</div></div>`;
  return mine.map(o=>{
    const p = DATA.props.find(x=>x.id===o.property_id); if(!p) return '';
    const c = calc(p,o);
    return `<div class="panel">
      <div class="phead"><div><h3>${esc(p.name)}</h3>
        <div class="soft" style="font-size:13px">${esc(p.address||'')} · ${esc(coName(p.company_id))}</div></div>
        <span class="badge">${(c.pct*100).toFixed(1)}% partur</span></div>
      <div class="grid3">
        <div class="stat"><div class="l">Mín eginfígging</div><div class="v">${krS(c.capital)}</div></div>
        <div class="stat"><div class="l">Mítt frívirði</div><div class="v gold">${krS(c.share)}</div></div>
        <div class="stat"><div class="l">Reel vinningur</div><div class="v ${c.gain>=0?'green':'red'}">${krS(c.gain)}</div></div>
      </div>
      <table style="margin-top:16px"><tbody>

function table(head, rows){
  const th = head.map(h=>`<th class="${/Virði|Lán|Frívirði|Partur|Eginfígging|Upphædd|vinningur/i.test(h)?'num':''}">${h}</th>`).join('');
  const tb = rows.map(r=>'<tr>'+r.map(c=>{
    if(c && typeof c==='object'){
      if(c.h!==undefined) return `<td>${c.h}</td>`;
      return `<td class="num ${c.c||''}">${c.n}</td>`;
    }
    return `<td>${c}</td>`;
  }).join('')+'</tr>').join('');
  return `<div style="overflow-x:auto"><table><thead><tr>${th}</tr></thead><tbody>${tb}</tbody></table></div>`;
}

/* ============================================================
   MARKNAÐUR — bert fyri umsitarar
   Les tað scraparin leggur út. Feltanøvnini kunnu broytast,
   so vit normalisera alt sum kemur inn.
   ============================================================ */
const MKT_URL_KEY = 'mkt_url_627';
const MKT_DEFAULT = 'https://raw.githubusercontent.com/Johannus4/627/main/marknadur.json';
let MKT = {rows:[], loaded:false, err:null, updated:null};
let MKTM = localStorage.getItem('mkt_market_627') || 'fo';   // fo | dk | all

const num = v => {
  if(v==null) return null;
  if(typeof v==='number') return isFinite(v)?v:null;
  // Tak bert fyrsta talbólkin, so "145 m2" ikki verður 1452
  const m = String(v).match(/-?\d[\d.,\s]*/);
  if(!m) return null;
  const s = m[0].replace(/\s/g,'')
    .replace(/\.(?=\d{3}(\D|$))/g,'')   // túsundskiljari: 2.450.000
    .replace(/,(?=\d{3}(\D|$))/g,'')    // ella 2,450,000
    .replace(',','.');                  // desimalkomma
  const n = parseFloat(s);
  return isFinite(n)?n:null;
};
const pick = (o,...keys) => { for(const k of keys){ if(o[k]!=null && o[k]!=='') return o[k]; } return null; };

function normalize(raw){
  let arr = Array.isArray(raw) ? raw
    : (raw.listings || raw.data || raw.properties || raw.ognir || raw.items || []);
  if(!Array.isArray(arr)) arr=[];
  const today = new Date();
  return arr.map(r=>{
    const price = num(pick(r,'price','prisur','pris','asking_price','upphaedd','kostur'));
    const area  = num(pick(r,'area','m2','sqm','stodd','size','fermetrar','bustovn'));
    const first = pick(r,'first_seen','firstSeen','listed','listed_date','scraped_at','date','created_at');
    let days = num(pick(r,'days_on_market','liggetid','dagar'));
    if(days==null && first){
      const d=new Date(first);
      if(!isNaN(d)) days = Math.max(0, Math.round((today-d)/864e5));
    }
    const src = pick(r,'source','kelda','site') || '—';
    return {
      market: pick(r,'market','marknadur') || (/\.dk|boligsiden|boliga|resights|home|edc|nybolig/i.test(String(src))?'dk':'fo'),
      title: pick(r,'title','heiti','name','address','adressa','bustadur') || '—',
      place: pick(r,'place','bygd','town','city','location','stadur','kommuna','bygdin') || '—',
      type:  pick(r,'type','slag','property_type','category') || '—',
      rooms: num(pick(r,'rooms','kom','bedrooms','rum')),
      source: src,
      url:   pick(r,'url','link','slod'),
      price, area, days,
      ppm2: (price && area) ? price/area : null
    };
  }).filter(r=>r.price || r.area);
}

const median = a => { const x=a.filter(v=>v!=null&&isFinite(v)).sort((p,q)=>p-q);
  if(!x.length) return null; const m=x.length>>1;
  return x.length%2 ? x[m] : (x[m-1]+x[m])/2; };

async function initMarket(){
  const cfg=$('mktCfg'), box=$('mktCfgBox');
  if(cfg) cfg.onclick=()=>{ box.style.display = box.style.display==='none'?'block':'none'; };
  if($('mktSave')) $('mktSave').onclick=()=>{
    localStorage.setItem(MKT_URL_KEY,$('mktUrl').value.trim()); MKT.loaded=false; initMarket(); };
  if($('mktReload')) $('mktReload').onclick=()=>{ MKT.loaded=false; initMarket(); };

  if(!MKT.loaded){
    const url = localStorage.getItem(MKT_URL_KEY) || MKT_DEFAULT;
    try{
      const r = await fetch(url, {cache:'no-store'});
      if(!r.ok) throw new Error('HTTP '+r.status+' — fíluna finst ikki (enn).');
      const j = await r.json();
      MKT.rows = normalize(j);
      MKT.updated = j.updated_at || j.generated || null;
      MKT.err = null;
    }catch(e){ MKT.err = e.message; MKT.rows=[]; }
    MKT.loaded = true;
  }
  drawMarket();
}

};
const dcfg = () => { try{ return Object.assign({},DEAL_DEF,JSON.parse(localStorage.getItem(DEAL_K)||'{}')); }catch(e){ return {...DEAL_DEF}; } };
const dsave = c => { try{ localStorage.setItem(DEAL_K, JSON.stringify(c)); }catch(e){} };

// Mánaðarliga avdráttargjaldið á einum annuitetsláni
function pmt(principal, annualPct, years){
  const r=(annualPct/100)/12, n=years*12;
  if(!principal||!n) return 0;
  if(!r) return principal/n;
  return principal*r/(1-Math.pow(1+r,-n));
}

// Samanberiligar ognir: sama bygd, ±25% stødd. Fella aftur til allan marknaðin.
function comps(place, area){
  const all = MKT.rows.filter(r=>r.ppm2 && (MKTM==='all'||r.market===MKTM));
  let c = all.filter(r=>r.place===place);
  if(area) c = c.filter(r=>!r.area || Math.abs(r.area-area)/area<=0.25);
  if(c.length<3) c = all.filter(r=>r.place===place);
  if(c.length<3) c = all;
  return c;
}

function runDeal(){
  const c=dcfg();
  const place=$('d_place').value.trim(), ask=+$('d_ask').value||0, area=+$('d_area').value||0;
  const days=+$('d_days').value||0, scope=$('d_scope').value;
  const kb=($('d_kb').value||'0/0').split('/').map(x=>parseInt(x)||0);
  const rentIn=+$('d_rent').value||0;

  // ---- 1. Marknaðarnívá ----
  const cp=comps(place,area);
  const ppmList=cp.map(r=>r.ppm2).filter(Boolean).sort((a,b)=>a-b);
  const med = ppmList.length? (ppmList.length%2? ppmList[ppmList.length>>1]
            : (ppmList[(ppmList.length>>1)-1]+ppmList[ppmList.length>>1])/2) : 0;
  const p25 = ppmList.length? ppmList[Math.floor(ppmList.length*0.25)] : 0;
  const p75 = ppmList.length? ppmList[Math.floor(ppmList.length*0.75)] : 0;
  const askPpm = area? ask/area : 0;

  // ---- 2. Umvælingarkostnaður ----
  let reno=0;
  if(scope!=='0'){
    reno = area*(c.reno[scope]||0);
    if(scope!=='kosmetisk'){ reno += (kb[0]||0)*c.kokk + (kb[1]||0)*c.bad; }
  }
  // ---- 3. ARV: marknaðarnívá eftir umvæling ----
  const arvPpm = scope==='0'? med : (scope==='kosmetisk'? med*1.02 : scope==='midal'? med*1.08 : med*1.15);
  const arv = area*arvPpm;

  // ---- 4. Hvat eigur tú at bjóða ----
  // (a) 75%-reglan: ARV*0,75 minus umvæling
  const bidRule = arv*0.75 - reno;
  // (b) Út frá cashflow: tað sum ger cashflow = 0 við LTV og rentu
  const rent = rentIn || (area*med*0.0045);   // mett leiga um einki er skrivað
  const netRent = rent*(1-c.vacancy/100)*(1-c.mgmt/100) - (arv*c.maint/100)/12;
  const maxPayment = netRent;
  const r=(c.rate/100)/12, n=c.term*12;
  const maxLoan = r? maxPayment*(1-Math.pow(1+r,-n))/r : maxPayment*n;
  const bidCF = maxLoan/(c.ltv/100) - reno;
  const bid = Math.min(bidRule, bidCF);

  // ---- 5. Prútingarrúm út frá liggitíð ----
  const disc = days>180?12 : days>120?9 : days>60?6 : days>30?3 : 0;
  const likely = ask*(1-disc/100);

  // ---- 6. BRRRR ----
  const buy = bid>0? bid : ask;
  const costs = buy*(c.stampDuty/100) + c.closing;
  const allIn = buy + reno + costs;
  const refi = arv*(c.ltv/100);
  const left = allIn - refi;
  const pay = pmt(refi, c.rate, c.term);
  const cf = netRent - pay;
  const coc = left>0? (cf*12)/left*100 : (cf>0? Infinity : 0);

  const band = MKT.rows.filter(x=>(MKTM==='all'||x.market===MKTM) && x.price && Math.abs(x.price-arv)/arv<0.15)
    .sort((a,b)=>Math.abs(a.price-arv)-Math.abs(b.price-arv)).slice(0,8);

  const verdict = (!med) ? ['Ongar marknaðardátur','soft']
    : askPpm && askPpm < p25 ? ['Áhugaverd — undir 25% av marknaðinum','green']
    : askPpm && askPpm < med ? ['Undir miðal','green']
    : askPpm && askPpm < p75 ? ['Á miðal nívá','gold']
    : ['Dýr mót marknaðinum','red'];

  $('dOut').innerHTML = `
  <div class="panel" style="background:var(--panel2)">
    <div class="phead"><h3>Niðurstøða</h3>
      <span class="badge ${verdict[1]}" style="color:var(--${verdict[1]==='soft'?'soft':verdict[1]})">${verdict[0]}</span></div>
    <div class="grid3">
      <div class="stat"><div class="l">Eigur at bjóða</div><div class="v ${bid>0?'gold':'red'}">${bid>0?krS(bid):'—'}</div>
        <div class="soft mono" style="font-size:11px;margin-top:4px">útbodnur ${krS(ask)}</div></div>
      <div class="stat"><div class="l">Virði eftir umvæling</div><div class="v sea">${krS(arv)}</div>
        <div class="soft mono" style="font-size:11px;margin-top:4px">${Math.round(arvPpm).toLocaleString('da-DK')} kr/m²</div></div>
      <div class="stat"><div class="l">Cashflow á mána</div><div class="v ${cf>=0?'green':'red'}">${krS(cf)}</div>
        <div class="soft mono" style="font-size:11px;margin-top:4px">CoC ${isFinite(coc)?coc.toFixed(1)+'%':'∞'}</div></div>
    </div>
  </div>

  <div class="panel"><h3>Marknaðurin í ${esc(place||'øllum bygdum')}
    <span class="badge" style="color:var(--${MKTM==='dk'?'gold':'sea'});margin-left:8px">${MKTM==='dk'?'Danmark':MKTM==='fo'?'Føroyar':'Bæði'}</span></h3>
    <table><tbody>
      <tr><td class="soft">Samanberiligar ognir</td><td class="num">${cp.length}</td></tr>
      <tr><td class="soft">Lágt nívá (25%)</td><td class="num">${p25?Math.round(p25).toLocaleString('da-DK')+' kr/m²':'—'}</td></tr>
      <tr><td class="soft">Miðal</td><td class="num sea">${med?Math.round(med).toLocaleString('da-DK')+' kr/m²':'—'}</td></tr>
      <tr><td class="soft">Høgt nívá (75%)</td><td class="num">${p75?Math.round(p75).toLocaleString('da-DK')+' kr/m²':'—'}</td></tr>
      <tr><td class="soft">Henda ognin</td><td class="num ${askPpm&&med&&askPpm<med?'green':'red'}">${askPpm?Math.round(askPpm).toLocaleString('da-DK')+' kr/m²':'—'}</td></tr>
    </tbody></table>
  </div>

  <div class="panel"><h3>Umvæling og prúting</h3>
    <table><tbody>
      <tr><td class="soft">Umvælingarkostnaður</td><td class="num">${kr(reno)}</td></tr>
      <tr><td class="soft">Keypsútreiðslur (tinglýsing o.a.)</td><td class="num">${kr(costs)}</td></tr>
      <tr><td class="soft">Liggitíð</td><td class="num">${days} dagar</td></tr>
      <tr><td class="soft">Prútingarrúm eftir liggitíð</td><td class="num ${disc?'green':''}">${disc}%</td></tr>
      <tr><td class="soft">Sannlíkur søluprísur</td><td class="num gold">${kr(likely)}</td></tr>
      <tr><td class="soft">Hámark eftir 75%-regluni</td><td class="num">${kr(bidRule)}</td></tr>
      <tr><td class="soft">Hámark eftir cashflow</td><td class="num">${kr(bidCF)}</td></tr>
    </tbody></table>
    <div class="soft" style="margin-top:12px;font-size:14px">
      Vit taka tað lægra av teimum tveimum. 75%-reglan verjir egnognina, cashflow-reglan verjir likviditetin.</div>
  </div>

  <div class="panel"><h3>BRRRR — hvat verður bundið</h3>
    <table><tbody>
      <tr><td class="soft">Keyp</td><td class="num">${kr(buy)}</td></tr>
      <tr><td class="soft">+ Umvæling</td><td class="num">${kr(reno)}</td></tr>
      <tr><td class="soft">+ Útreiðslur</td><td class="num">${kr(costs)}</td></tr>
      <tr><td class="soft"><strong>= Alt í alt</strong></td><td class="num"><strong>${kr(allIn)}</strong></td></tr>
      <tr><td class="soft">Refinansiering (${c.ltv}% av ARV)</td><td class="num sea">${kr(refi)}</td></tr>
      <tr><td class="soft"><strong>Bundin eginfígging</strong></td><td class="num ${left<=0?'green':'gold'}"><strong>${kr(Math.max(0,left))}</strong>${left<=0?' — alt heintað aftur':''}</td></tr>
      <tr><td class="soft">Leiga á mána</td><td class="num">${kr(rent)}</td></tr>
      <tr><td class="soft">− tómstøða, umsiting, viðlíkahald</td><td class="num red">${kr(rent-netRent)}</td></tr>
      <tr><td class="soft">− avdrátt og renta</td><td class="num red">${kr(pay)}</td></tr>
      <tr><td class="soft"><strong>Cashflow á mána</strong></td><td class="num ${cf>=0?'green':'red'}"><strong>${kr(cf)}</strong></td></tr>
    </tbody></table>
  </div>

  <div class="panel"><h3>Hvat kappast tú við eftir umvæling</h3>
    ${band.length? table(['Heiti','Marknaður','Bygd','m²','Prísur','kr/m²','Dagar'],
      band.map(r=>[esc(String(r.title).slice(0,46)),
        {h:`<span class="badge" style="color:var(--${r.market==='dk'?'gold':'sea'})">${r.market==='dk'?'DK':'FO'}</span>`},
        esc(r.place), {n:r.area?Math.round(r.area):'—'},
        {n:krS(r.price)}, {n:r.ppm2?Math.round(r.ppm2).toLocaleString('da-DK'):'—'},
        {n:r.days!=null?Math.round(r.days):'—'}]))
      : '<div class="empty">Ongar samanberiligar annonsur í hesum prísbili.</div>'}
    <div class="soft" style="margin-top:12px;font-size:14px">
      Hesir bústaðir eru teir ein keypari velur ímillum í staðin fyri tín. Liggja teir leingi, er ARV-mettanin ov høg.</div>
  </div>`;
}

/* ---------- actions ---------- */
function wire(){
  $('view').querySelectorAll('[data-act]').forEach(b=>b.onclick=()=>act(b.dataset));
}

function form(title, fields, onSave){
  $('dlgBody').innerHTML = `<h2>${title}</h2><form id="f">`+
    fields.map(f=>{
      if(f.type==='select')
        return `<label>${f.label}</label><select name="${f.name}">`+
          f.options.map(o=>`<option value="${esc(o.v)}">${esc(o.l)}</option>`).join('')+`</select>`;
      return `<label>${f.label}</label><input name="${f.name}" type="${f.type||'text'}" value="${esc(f.value??'')}" ${f.required?'required':''}>`;
    }).join('')+
    `<div class="row" style="margin-top:22px"><button type="submit">Goym</button>
     <button type="button" class="ghost" id="cancel">Avlýs</button></div>
     <div id="fmsg"></div></form>`;
  $('dlg').showModal();
  $('cancel').onclick=()=>$('dlg').close();
  $('f').onsubmit = async e => {
    e.preventDefault();
    const d = Object.fromEntries(new FormData(e.target));
    const err = await onSave(d);
    if(err){ $('fmsg').innerHTML = `<div class="err">${esc(err)}</div>`; return; }
    $('dlg').close(); await load(); render();
  };
}

async function act(d){
  const A = d.act;
  if(A==='newCo') return form('Nýtt felag',[{label:'Navn',name:'name',required:1}],
    async v => (await sb.from('companies').insert({name:v.name})).error?.message);

  if(A==='newProp' || A==='editProp'){
    const p = A==='editProp' ? DATA.props.find(x=>x.id===d.id) : {};
    return form(A==='editProp'?'Rætta ogn':'Nýggj ogn',[
      {label:'Navn',name:'name',value:p.name,required:1},
      {label:'Bústaður',name:'address',value:p.address},
      {label:'Felag',name:'company_id',type:'select',
        options:[{v:'',l:'— einki —'},...DATA.companies.map(c=>({v:c.id,l:c.name}))]},
      {label:'Keypsprísur',name:'purchase_price',type:'number',value:p.purchase_price||0},
      {label:'Virði í dag',name:'current_value',type:'number',value:p.current_value||0},
      {label:'Stødd (m²)',name:'area',type:'number',value:p.area||0,hint:'neyðugt fyri virðismeting'},
      {label:'Lán (restskuld)',name:'loan_balance',type:'number',value:p.loan_balance||0},
      {label:'Leiga á mána',name:'monthly_rent',type:'number',value:p.monthly_rent||0},
      {label:'Útreiðslur á mána',name:'monthly_expenses',type:'number',value:p.monthly_expenses||0},
      {label:'Umvæling',name:'renovation_cost',type:'number',value:p.renovation_cost||0},
      {label:'Keypsdagur',name:'purchase_date',type:'date',value:p.purchase_date||''},
      {label:'Viðmerking',name:'notes',type:'text',value:p.notes||''},
    ], async v => {
      const rent=+v.monthly_rent||0, exp=+v.monthly_expenses||0;
      const row = {name:v.name, address:v.address, company_id:v.company_id||null,
        purchase_price:+v.purchase_price, current_value:+v.current_value,
        loan_balance:+v.loan_balance, area:+v.area||null, monthly_rent:rent, monthly_expenses:exp,
        monthly_cashflow:rent-exp, renovation_cost:+v.renovation_cost||0,
        purchase_date:v.purchase_date||null, notes:v.notes||null};
      const r = A==='editProp'
        ? await sb.from('properties').update(row).eq('id',d.id)
        : await sb.from('properties').insert(row);
      return r.error?.message;
    });
  }

  if(A==='newOwner') return form('Knýt eigara at ogn',[
    {label:'Ogn',name:'property_id',type:'select',options:DATA.props.map(p=>({v:p.id,l:p.name}))},
    {label:'Eigari',name:'user_id',type:'select',options:DATA.profiles.map(u=>({v:u.id,l:u.full_name||u.email}))},
    {label:'Partur (%)',name:'pct',type:'number',value:50},
    {label:'Eginfígging (kr)',name:'capital',type:'number',value:0},
  ], async v => (await sb.from('property_owners').insert(
      {property_id:v.property_id,user_id:v.user_id,pct:+v.pct,capital:+v.capital})).error?.message);

  if(A==='newDist') return form('Skráset útgjalding',[
    {label:'Ogn',name:'property_id',type:'select',options:DATA.props.map(p=>({v:p.id,l:p.name}))},
    {label:'Móttakari',name:'user_id',type:'select',options:DATA.profiles.map(u=>({v:u.id,l:u.full_name||u.email}))},
    {label:'Upphædd',name:'amount',type:'number',required:1},
    {label:'Dagur',name:'paid_on',type:'date'},
    {label:'Viðmerking',name:'note'},
  ], async v => (await sb.from('distributions').insert(
      {property_id:v.property_id,user_id:v.user_id,amount:+v.amount,paid_on:v.paid_on||null,note:v.note})).error?.message);

  if(A==='newDoc') return form('Legg skjal til',[
    {label:'Ogn',name:'property_id',type:'select',options:DATA.props.map(p=>({v:p.id,l:p.name}))},
    {label:'Heiti',name:'title',required:1},
    {label:'Leinkja (t.d. Google Drive)',name:'url'},
  ], async v => (await sb.from('documents').insert(
      {property_id:v.property_id,title:v.title,url:v.url})).error?.message);

  if(A==='openProp'){ OPEN=d.id; render(); return; }
  if(A==='openCo'){ OPENC=d.id; render(); return; }
  if(A==='backCos'){ OPENC=null; render(); return; }
  if(A==='gotoProp'){ OPENC=null; OPEN=d.id; TAB='ognir'; renderTabs(); render(); return; }
  if(A==='backProps'){ OPEN=null; render(); return; }
  if(A==='role'){
    await sb.from('profiles').update({role:d.r}).eq('id',d.id);
    await load(); render(); return;
  }
  const dels = {delOwner:'property_owners', delDist:'distributions', delDoc:'documents'};
  if(dels[A]){
    if(!confirm('Strika?')) return;
    await sb.from(dels[A]).delete().eq('id',d.id);
    await load(); render();
  }
}
</script>
